[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seafile-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Seafile file storage — multi-user, dual auth (account token or per-library API tokens)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "seafile-mcp contributors" }]
keywords = ["mcp", "seafile", "model-context-protocol"]
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
seafile-mcp = "seafile_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
